"travel",name:"Travel & Hospitality",icon:"Plane",description:"Flight bookings, hotel stays, visa protocols, itineraries, luggage guidelines, and travel insurance.",categoryGroup:"Lifestyle & Services"},{id:"food",name:"Food & Restaurants",icon:"Utensils",description:"Dining reservations, dietary preferences, culinary terminology, food safety, and delivery systems.",categoryGroup:"Lifestyle & Services"},{id:"government",name:"Government Services",icon:"FileText",description:"Passport applications, civic permits, voting registry, public records, and public utilities.",categoryGroup:"Lifestyle & Services"},{id:"jobs",name:"Jobs & Careers",icon:"Briefcase",description:"Resume crafting, technical interviews, job hunting, salary negotiation, and career transitions.",categoryGroup:"Education & Careers",popular:!0},{id:"hr",name:"Human Resources",icon:"Users",description:"Workplace policies, employee onboarding, benefits, leave administration, and team conflict resolution.",categoryGroup:"Education & Careers"},{id:"business",name:"Business & Startups",icon:"TrendingUp",description:"Founding a venture, pitch decks, venture capital funding, unit economics, and growth strategy.",categoryGroup:"Business & Finance"},{id:"real-estate",name:"Real Estate",icon:"Home",description:"Property buying, rental agreements, property inspections, escrow, and landlord-tenant rules.",categoryGroup:"Business & Finance"},{id:"education",name:"Education & University",icon:"GraduationCap",description:"College admissions, scholarships, study habits, online degrees, exam preparation, and grading scales.",categoryGroup:"Education & Careers",popular:!0},{id:"legal",name:"Legal & Compliance",icon:"Scale",description:"Contracts, non-disclosure agreements (NDAs), copyright, terms of service, and privacy policies.",categoryGroup:"Lifestyle & Services"},{id:"productivity",name:"Productivity & Habits",icon:"CheckSquare",description:"Time management frameworks, Pomodoro technique, task prioritization, note-taking, and deep work.",categoryGroup:"Education & Careers"},{id:"data-science",name:"Data Science & Big Data",icon:"Database",description:"Pandas, NumPy, data pipelines, SQL querying, exploratory data analysis, and predictive modeling.",categoryGroup:"Technology & Dev",popular:!0},{id:"devops",name:"DevOps & CI/CD",icon:"GitBranch",description:"Continuous integration, continuous deployment, automated testing, monitoring, and site reliability.",categoryGroup:"Technology & Dev"},{id:"gaming",name:"Entertainment & Gaming",icon:"Gamepad2",description:"Game engines, Unity, Unreal Engine, frame rates, streaming platforms, and game design.",categoryGroup:"Lifestyle & Services"},{id:"marketing",name:"Marketing & SEO",icon:"Target",description:"Search Engine Optimization, Google Ads, content marketing, email marketing funnels, and analytics.",categoryGroup:"Business & Finance"},{id:"environment",name:"Environment & Climate",icon:"Leaf",description:"Renewable energy, solar power, carbon footprints, circular economy, and ecological sustainability.",categoryGroup:"Lifestyle & Services"}],yt=[{id:"tech-1",domain:"technology",category:"Hardware & OS",question:"What is an operating system?",answer:"An Operating System (OS) is the fundamental system software that manages computer hardware and software resources, providing common services and interfaces for computer programs. Examples include Microsoft Windows, macOS, Linux, Android, and iOS.",keywords:["operating system","os","windows","linux","hardware","software"],relatedIds:["tech-2","tech-3"]},{id:"tech-2",domain:"technology",category:"Hardware",question:"What is the difference between RAM and SSD storage?",answer:"RAM (Random Access Memory) is volatile temporary memory that holds data currently used by active processes for ultra-fast reading and writing; its contents disappear when powered off. An SSD (Solid State Drive) is non-volatile persistent storage that stores your files, applications, and operating system permanently even when turned off.",keywords:["ram","ssd","storage","memory","volatile","hard drive"],relatedIds:["tech-1","tech-4"]},{id:"tech-3",domain:"technology",category:"Networking",question:"What is an IP address and how does it work?",answer:"An IP (Internet Protocol) address is a unique numerical label assigned to each device connected to a computer network that uses the Internet Protocol for communication. It serves two primary functions: network interface identification and location addressing (e.g., IPv4 addresses like 192.168.1.1 or 128-bit IPv6 addresses).",keywords:["ip address","network","ipv4","ipv6","internet protocol","routing"],relatedIds:["tech-5","tech-7"]},{id:"tech-4",domain:"technology",category:"Hardware",question:"What is the role of a GPU compared to a CPU?",answer:"A CPU (Central Processing Unit) is optimized for serial processing and handles general-purpose computer logic and single-thread execution speed. A GPU (Graphics Processing Unit) has thousands of smaller cores engineered for massive parallel workloads, making it ideal for rendering graphics, video encoding, and training neural networks.",keywords:["gpu","cpu","processor","graphics","cores","parallel processing"],relatedIds:["tech-1","ai-2"]},{id:"tech-5",domain:"technology",category:"Networking",question:"What is DNS and why is it called the phonebook of the internet?",answer:"DNS (Domain Name System) translates human-readable domain names (such as google.com) into machine-readable IP addresses (like 142.250.190.46) so browsers can locate web servers. Because humans remember words better than strings of numbers, it acts as the digital phonebook.",keywords:["dns","domain name system","ip","domain","nameserver","web address"],relatedIds:["tech-3","web-1"]},{id:"tech-6",domain:"technology",category:"Emerging Tech",question:"What is the Internet of Things (IoT)?",answer:"The Internet of Things (IoT) describes the collective network of connected physical devices, vehicles, appliances, and industrial sensors embedded with software and network connectivity that communicate and exchange real-time data over the internet.",keywords:["iot","internet of things","smart devices","sensors","connected hardware"],relatedIds:["tech-1","cloud-1"]},{id:"tech-7",domain:"technology",category:"Networking",question:"What is the difference between Wi-Fi and Bluetooth?",answer:"Wi-Fi is designed for high-bandwidth, longer-range local area networking (LAN) connecting devices to the internet via routers. Bluetooth is a short-range, low-power personal area network (PAN) technology designed primarily to pair peripheral accessories (headphones, mice, keyboards) directly to a host device.",keywords:["wifi","bluetooth","wireless","networking","connectivity","range"],relatedIds:["tech-3","tech-6"]},{id:"tech-8",domain:"technology",category:"Hardware",question:"What does 64-bit architecture mean compared to 32-bit?",answer:"A 64-bit processor can process 64 bits of data per clock cycle and address up to 16 exabytes of RAM, whereas a 32-bit processor is architecturally capped at referencing 4 GB of RAM, limiting performance for intensive modern software.",keywords:["64 bit","32 bit","processor","architecture","ram limit","cpu"],relatedIds:["tech-2","tech-4"]},{id:"tech-9",domain:"technology",category:"Data Storage",question:"What is RAID in data storage?",answer:"RAID (Redundant Array of Independent Disks) is a data storage virtualization technology that combines multiple physical disk drive components into one or more logical units for data redundancy, performance improvement, or both (such as RAID 0, RAID 1, RAID 5, and RAID 10).",keywords:["raid","disk array","redundancy","storage","data protection","backup"],relatedIds:["tech-2","cloud-3"]},{id:"tech-10",domain:"technology",category:"Hardware",question:"What is a motherboard and what does it connect?",answer:"The motherboard is the main printed circuit board (PCB) within a computer. It serves as the central communications backbone through which the CPU, RAM, graphics card, solid-state drives, and all peripherals exchange electrical signals and power.",keywords:["motherboard","pcb","hardware","components","cpu","pc build"],relatedIds:["tech-1","tech-2","tech-4"]},{id:"prog-1",domain:"programming",category:"Fundamentals",question:"What is a variable in programming?",answer:"A variable is a symbolic named storage location in computer memory that holds a value or reference which can be read, manipulated, and updated during program execution. Variables typically have a specific data type such as integer, string, boolean, or float.",keywords:["variable","memory","data type","assignment","state","value"],relatedIds:["prog-2","prog-3"]},{id:"prog-2",domain:"programming",category:"Fundamentals",question:"What is a function or method?",answer:"A function is an encapsulated, reusable block of code designed to perform a single specific task. It accepts optional inputs (parameters/arguments), executes programmatic logic, and optionally returns an output value.",keywords:["function","method","parameters","arguments","return value","reusable code"],relatedIds:["prog-1","prog-4"]},{id:"prog-3",domain:"programming",category:"Data Structures",question:"What is the difference between an array and an object or dictionary?",answer:"An array (or list) is an ordered collection of elements indexed sequentially by integers (0, 1, 2...). An object (or dictionary/hash map) is an unordered or key-value mapped collection where values are associated with named textual keys rather than integer indices.",keywords:["array","object","dictionary","hashmap","list","data structure","key value"],relatedIds:["prog-1","prog-5"]},{id:"prog-4",domain:"programming",category:"Object Oriented",question:"What are the four pillars of Object-Oriented Programming (OOP)?",answer:"The four pillars of OOP are: 1) Encapsulation (bundling data and methods while restricting direct external access), 2) Abstraction (hiding complex internal details behind clean interfaces), 3) Inheritance (creating new classes derived from existing ones), and 4) Polymorphism (the ability of different classes to respond to the same method call in domain-specific ways).",keywords:["oop","object oriented","encapsulation","inheritance","polymorphism","abstraction","classes"],relatedIds:["prog-2","prog-7"]},{id:"prog-5",domain:"programming",category:"Algorithms",question:"What is Big O notation and why is it important?",answer:"Big O notation is a mathematical metric used in computer science to classify algorithms according to how their run time or memory space requirements grow relative to the input size (N). Common complexities include O(1) constant time, O(log N) logarithmic, O(N) linear, and O(N^2) quadratic.",keywords:["big o","complexity","time complexity","space complexity","algorithms","performance"],relatedIds:["prog-3","prog-6"]},{id:"prog-6",domain:"programming",category:"Algorithms",question:"What is recursion in programming?",answer:"Recursion is an algorithmic technique where a function solves a problem by calling itself with smaller sub-problems until it hits a defined base case that stops further recursive calls, preventing an infinite loop or stack overflow error.",keywords:["recursion","recursive function","base case","call stack","stack overflow"],relatedIds:["prog-2","prog-5"]},{id:"prog-7",domain:"programming",category:"Languages",question:"What is the difference between compiled and interpreted languages?",answer:"Compiled languages (like C++, Go, and Rust) translate source code directly into machine code before runtime via a compiler, producing fast standalone binaries. Interpreted languages (like Python and JavaScript) read and execute code line-by-line via an interpreter at runtime.",keywords:["compiled","interpreted","compiler","interpreter","c++","python","machine code"],relatedIds:["prog-8","prog-10"]},{id:"prog-8",domain:"programming",category:"Languages",question:"What is Python and why is it so popular?",answer:"Python is a high-level, interpreted, general-purpose programming language renowned for its clean, readable English-like syntax. It is immensely popular across Data Science, Artificial Intelligence, Web Backend development (Django/FastAPI), and automation due to its massive ecosystem of open-source libraries.",keywords:["python","syntax","programming language","data science","fastapi","django"],relatedIds:["prog-7","ai-1"]},{id:"prog-9",domain:"programming",category:"Git & Version Control",question:"What is Git and how does version control work?",answer:"Git is a distributed version control system that tracks modifications made to computer files over time. It allows developers to branch off new features independently, commit snapshots of work, collaborate on codebases, and revert to previous states without file loss.",keywords:["git","version control","github","commit","branch","repository","merge"],relatedIds:["prog-10","cloud-4"]},{id:"prog-10",domain:"programming",category:"Best Practices",question:"What does DRY stand for in software engineering?",answer:`DRY stands for "Don't Repeat Yourself". It is a fundamental software engineering principle stating that every piece of knowledge or business logic must have a single, unambiguous, authoritative representation within a system, minimizing code duplication and bugs.`,keywords:["dry","clean code","refactoring","software engineering","principles"],relatedIds:["prog-2","prog-4"]},{id:"ai-1",domain:"ai",category:"Overview",question:"What is artificial intelligence (AI)?",answer:"Artificial Intelligence is a branch of computer science dedicated to creating software systems capable of performing tasks that traditionally require human intelligence, such as visual perception, natural language understanding, reasoning, problem-solving, and decision-making.",keywords:["ai","artificial intelligence","machine intelligence","cognitive computing"],relatedIds:["ai-2","ai-3","ai-4"]},{id:"ai-2",domain:"ai",category:"LLMs & GenAI",question:"What is a Large Language Model (LLM)?",answer:"A Large Language Model (LLM) is an advanced deep learning model based on the Transformer architecture trained on vast corpora of textual data. It predicts probability distributions of subsequent words (tokens) to generate coherent natural language, summarize text, code, and perform dialogue.",keywords:["llm","large language model","gpt","transformer","tokens","generative ai"],relatedIds:["ai-1","ai-5"]},{id:"ai-3",domain:"ai",category:"NLP",question:"What is Natural Language Processing (NLP)?",answer:"Natural Language Processing (NLP) is the interdisciplinary subfield of AI and linguistics focused on giving computers the ability to process, understand, analyze, and generate human languages. Core tasks include sentiment analysis, entity recognition, translation, and semantic similarity matching.",keywords:["nlp","natural language processing","tokenization","sentiment analysis","text parsing"],relatedIds:["ai-1","ai-2"]},{id:"ai-4",domain:"ai",category:"Computer Vision",question:"What is Computer Vision in AI?",answer:"Computer Vision is a field of AI enabling computers to derive meaningful information and identify patterns from digital images, video streams, and visual inputs, utilizing Convolutional Neural Networks (CNNs) for object detection, medical imaging, and autonomous vehicle navigation.",keywords:["computer vision","cnn","image recognition","object detection","autonomous driving"],relatedIds:["ai-1","ml-3"]},{id:"ai-5",domain:"ai",category:"GenAI & Prompting",question:"What is prompt engineering?",answer:"Prompt engineering is the practice of crafting, refining, and structuring textual instructions and context provided to generative AI models to elicit the most accurate, relevant, formatted, and deterministic responses.",keywords:["prompt engineering","prompts","context","few shot","chain of thought","generative ai"],relatedIds:["ai-2","ai-6"]},{id:"ai-6",domain:"ai",category:"Hallucination & RAG",question:"What is AI hallucination and how is it mitigated?",answer:"AI hallucination occurs when an AI model confidently generates plausible-sounding statements that are factually incorrect or unsupported by its training data. It is mitigated using Retrieval-Augmented Generation (RAG), strict knowledge-base grounding, temperature tuning, and citation verification.",keywords:["hallucination","rag","retrieval augmented generation","grounding","accuracy"],relatedIds:["ai-2","ai-5"]},{id:"ai-7",domain:"ai",category:"Ethics & Safety",question:"What is AI alignment and safety?",answer:"AI alignment is the research field aimed at ensuring that artificial intelligence systems steer toward human values, ethical objectives, and intended goals without producing harmful, biased, deceptive, or unintended adverse consequences.",keywords:["alignment","ai safety","ethics","bias","responsible ai"],relatedIds:["ai-1","ai-8"]},{id:"ai-8",domain:"ai",category:"Agents",question:"What is an AI agent?",answer:"An AI agent is an autonomous software entity that perceives its environment through inputs, makes reasoned decisions or plans using a foundational reasoning model, and takes concrete actions using external tools, APIs, and persistent memory to achieve defined goals.",keywords:["ai agent","autonomous agent","tools","function calling","reasoning"],relatedIds:["ai-2","ai-5"]},{id:"ai-9",domain:"ai",category:"History",question:"What is the Turing Test?",answer:"Proposed by British mathematician Alan Turing in 1950, the Turing Test is a benchmark test of a machine's ability to exhibit intelligent behavior indistinguishable from that of a human through text-based conversational interaction.",keywords:["turing test","alan turing","imitation game","intelligence benchmark"],relatedIds:["ai-1","ai-3"]},{id:"ai-10",domain:"ai",category:"LLMs & GenAI",question:"What are tokens in AI language models?",answer:"Tokens are the basic atomic units of text that language models read and produce. A token can represent a single character, word, or sub-word (on average, 1,000 tokens represent roughly 750 words in English). Models calculate context limits and compute costs based on token counts.",keywords:["tokens","tokenization","context window","subwords","bpe"],relatedIds:["ai-2","ai-3"]},{id:"ml-1",domain:"machine-learning",category:"Fundamentals",question:"What is the difference between supervised and unsupervised learning?",answer:"Supervised learning trains models on labeled datasets where each input has a known target ground truth (e.g. classification or regression). Unsupervised learning provides the model with unlabeled data and allows it to discover inherent clusters, patterns, or latent structures independently (e.g. K-Means clustering, PCA).",keywords:["supervised learning","unsupervised learning","labeled data","clustering","classification"],relatedIds:["ml-2","ml-4"]},{id:"ml-2",domain:"machine-learning",category:"Fundamentals",question:"What is overfitting and how do you prevent it?",answer:"Overfitting occurs when a machine learning model learns the noise, outliers, and details of the training data too closely, resulting in poor generalization on new, unseen data. It is prevented by cross-validation, regularization (L1/L2), pruning, dropout layers, and gathering more training data.",keywords:["overfitting","generalization","regularization","cross validation","dropout"],relatedIds:["ml-1","ml-5"]},{id:"ml-3",domain:"machine-learning",category:"Deep Learning",question:"What is a neural network?",answer:"A neural network is a computational learning model inspired by the biological neural networks of human brains. It consists of interconnected layers of nodes (neurons): an input layer, one or more hidden layers that calculate weighted sums with non-linear activation functions, and an output layer.",keywords:["neural network","deep learning","neurons","activation function","weights"],relatedIds:["ml-1","ml-6"]},{id:"ml-4",domain:"machine-learning",category:"Reinforcement Learning",question:"What is Reinforcement Learning (RL)?",answer:"Reinforcement Learning is a machine learning paradigm where an autonomous agent learns optimal behavior through trial and error interactions with an environment, guided by scalar rewards for positive actions and penalties for negative ones (e.g. Q-learning, PPO).",keywords:["reinforcement learning","rl","reward","agent","policy","q learning"],relatedIds:["ml-1","ai-8"]},{id:"ml-5",domain:"machine-learning",category:"Metrics",question:"What is the difference between precision and recall?",answer:"Precision measures what proportion of positive identifications was actually correct (True Positives / (True Positives + False Positives)). Recall measures what proportion of actual positives was identified correctly (True Positives / (True Positives + False Negatives)). The F1-score balances both.",keywords:["precision","recall","f1 score","metrics","classification","confusion matrix"],relatedIds:["ml-1","ml-2"]},{id:"ml-6",domain:"machine-learning",category:"Training",question:"What is gradient descent and backpropagation?",answer:"Gradient descent is an optimization algorithm used to minimize a model's loss function by iteratively updating parameters in the opposite direction of the gradient. Backpropagation efficiently computes these partial derivatives (gradients) backwards through network layers using the calculus chain rule.",keywords:["gradient descent","backpropagation","optimization","loss function","chain rule"],relatedIds:["ml-3","ml-2"]},{id:"ml-7",domain:"machine-learning",category:"Techniques",question:"What is transfer learning?",answer:"Transfer learning is a machine learning method where a pre-trained model developed for one general task (e.g. BERT on Wikipedia or ResNet on ImageNet) is reused and fine-tuned as the starting foundation for a second, specialized task, requiring significantly less data and compute.",keywords:["transfer learning","fine tuning","pre trained models","bert","weights"],relatedIds:["ml-3","ai-2"]},{id:"ml-8",domain:"machine-learning",category:"Feature Engineering",question:"What is feature scaling and why is it necessary?",answer:"Feature scaling (such as Min-Max normalization or Standard Z-score scaling) brings numeric features into a shared, standardized scale. Without scaling, features with larger numeric magnitudes will disproportionately dominate distance calculations and gradient updates.",keywords:["feature scaling","normalization","standardization","z score","preprocessing"],relatedIds:["ml-1","ml-6"]},{id:"ml-9",domain:"machine-learning",category:"Data",question:"Why do we split data into training, validation, and test sets?",answer:"The training set teaches the model parameters. The validation set tunes hyperparameters and detects overfitting during training. The test set provides an unbiased, final evaluation of model accuracy and generalization on truly unseen data.",keywords:["train test split","validation set","test set","evaluation","data split"],relatedIds:["ml-2","ml-5"]},{id:"ml-10",domain:"machine-learning",category:"Concepts",question:"What is the bias-variance tradeoff?",answer:"The bias-variance tradeoff is the fundamental dilemma in machine learning: high bias models make oversimplified assumptions (underfitting), while high variance models are overly sensitive to small fluctuations in training data (overfitting). Optimal models balance both.",keywords:["bias variance","underfitting","overfitting","tradeoff","model error"],relatedIds:["ml-2","ml-5"]},{id:"web-1",domain:"web-dev",category:"Frontend",question:"What is HTML, CSS, and JavaScript in web development?",answer:"HTML (HyperText Markup Language) provides the structural skeleton of a website. CSS (Cascading Style Sheets) styles the layout, colors, typography, and visual presentation. JavaScript adds dynamic interactivity, event handling, logic, and client-side application behavior.",keywords:["html","css","javascript","frontend","web development","dom"],relatedIds:["web-2","web-3"]},{id:"web-2",domain:"web-dev",category:"Frontend",question:"What is React and what is the Virtual DOM?",answer:"React is an open-source declarative JavaScript library for building component-based user interfaces. It uses an in-memory Virtual DOM to compare state changes (reconciliation) and selectively re-render only the minimal changed parts of the real DOM, boosting application speed.",keywords:["react","virtual dom","components","jsx","reconciliation","frontend library"],relatedIds:["web-1","web-4"]},{id:"web-3",domain:"web-dev",category:"APIs & Backend",question:"What is a REST API and how does it work?",answer:"A REST (Representational State Transfer) API is an architectural style for networked systems. It uses standard HTTP methods: GET (retrieve data), POST (create data), PUT/PATCH (update data), and DELETE (remove data), transmitting payloads typically in JSON format.",keywords:["rest api","http","json","endpoints","get post","backend api"],relatedIds:["web-5","tech-3"]},{id:"web-4",domain:"web-dev",category:"Frontend",question:"What is the difference between client-side rendering (CSR) and server-side rendering (SSR)?",answer:"Client-Side Rendering (CSR) downloads a minimal HTML shell and executes JavaScript in the user's browser to construct UI elements on the fly. Server-Side Rendering (SSR) generates full HTML on the web server for each request, delivering faster initial page loads and superior SEO.",keywords:["csr","ssr","server side rendering","client side","seo","hydration"],relatedIds:["web-2","web-1"]},{id:"web-5",domain:"web-dev",category:"Security & HTTP",question:"What is CORS (Cross-Origin Resource Sharing)?",answer:"CORS is a browser security mechanism that restricts web applications running at one origin (domain, protocol, or port) from making HTTP requests to a resource on a different origin unless the server explicitly grants permission via HTTP response headers.",keywords:["cors","cross origin","browser security","http headers","api security"],relatedIds:["web-3","sec-1"]},{id:"web-6",domain:"web-dev",category:"Frontend",question:"What is responsive web design and mobile-first approach?",answer:"Responsive web design ensures web pages render effectively across a wide variety of devices and screen sizes using fluid grid systems, CSS media queries, and flexible imagery. Mobile-first design prioritizes styling for smaller screens before progressively enhancing for desktop displays.",keywords:["responsive design","mobile first","media queries","viewport","css layout"],relatedIds:["web-1","mob-1"]},{id:"web-7",domain:"web-dev",category:"Performance",question:"What are Web Vitals and why do they matter?",answer:"Web Vitals are standardized performance metrics developed by Google that measure real-world user experience on websites: Largest Contentful Paint (LCP for loading performance), Interaction to Next Paint (INP for responsiveness), and Cumulative Layout Shift (CLS for visual stability).",keywords:["web vitals","lcp","inp","cls","page speed","seo","performance"],relatedIds:["web-4","web-8"]},{id:"web-8",domain:"web-dev",category:"Data Storage",question:"What is the difference between localStorage, sessionStorage, and Cookies?",answer:"localStorage stores data persistently in the browser with no expiration date until explicitly cleared. sessionStorage retains data only for the duration of the current tab/session. Cookies store small strings (up to 4KB) with expiration dates and are automatically sent to the server with every HTTP request.",keywords:["localstorage","sessionstorage","cookies","browser storage","cache"],relatedIds:["web-1","sec-5"]},{id:"web-9",domain:"web-dev",category:"CSS",question:"What is Tailwind CSS and utility-first styling?",answer:"Tailwind CSS is a utility-first CSS framework providing low-level classes like flex, pt-4, text-center, and rounded-xl directly in markup. This speeds up UI development, prevents stylesheet bloat through build-time purging, and promotes design consistency.",keywords:["tailwind css","utility css","styles","responsive design","css framework"],relatedIds:["web-1","web-6"]},{id:"web-10",domain:"web-dev",category:"Backend",question:"What is GraphQL compared to REST?",answer:"GraphQL is a query language for APIs developed by Facebook that allows clients to request exactly the specific data fields they need in a single round-trip, avoiding the over-fetching and under-fetching common in fixed-endpoint REST architectures.",keywords:["graphql","rest","api query","overfetching","schema","apollo"],relatedIds:["web-3","web-5"]},{id:"cloud-1",domain:"cloud-computing",category:"Fundamentals",question:"What is cloud computing?",answer:'Cloud computing is the on-demand delivery of computing services—including servers, storage, databases, networking, software, and analytics—over the internet ("the cloud") with pay-as-you-go pricing, enabling flexible resources and economies of scale.',keywords:["cloud computing","aws","azure","cloud servers","infrastructure","on demand"],relatedIds:["cloud-2","cloud-3"]},{id:"cloud-2",domain:"cloud-computing",category:"Service Models",question:"What is the difference between IaaS, PaaS, and SaaS?",answer:"IaaS (Infrastructure as a Service) delivers raw compute, storage, and networking (e.g. AWS EC2). PaaS (Platform as a Service) provides a managed environment for developers to deploy apps without managing underlying hardware or OS (e.g. Heroku, Vercel). SaaS (Software as a Service) delivers end-user software applications over the web (e.g. Google Workspace, Salesforce).",keywords:["iaas","paas","saas","cloud models","ec2","managed platforms"],relatedIds:["cloud-1","saas-1"]},{id:"cloud-3",domain:"cloud-computing",category:"DevOps & Containers",question:"What is Docker and containerization?",answer:"Docker is an open-source platform that automates the deployment of applications inside lightweight, portable, self-sufficient containers. Containers package an application's code together with all runtime dependencies, guaranteeing it executes consistently across any environment.",keywords:["docker","containers","containerization","devops","images","virtualization"],relatedIds:["cloud-4","cloud-1"]},{id:"cloud-4",domain:"cloud-computing",category:"Orchestration",question:"What is Kubernetes (K8s)?",answer:"Kubernetes is an open-source container orchestration system for automating the deployment, scaling, load balancing, and management of containerized applications across clusters of host machines.",keywords:["kubernetes","k8s","orchestration","docker","clustering","pods"],relatedIds:["cloud-3","cloud-5"]},{id:"cloud-5",domain:"cloud-computing",category:"Architecture",question:"What is serverless computing?",answer:"Serverless computing is a cloud execution model where cloud providers dynamically manage the allocation and provisioning of servers. Code executes in stateless event-driven compute containers (e.g. AWS Lambda) and developers are billed solely for the exact execution time utilized.",keywords:["serverless","aws lambda","faas","event driven","cloud functions"],relatedIds:["cloud-1","cloud-2"]},{id:"cloud-6",domain:"cloud-computing",category:"Infrastructure",question:"What is Infrastructure as Code (IaC)?",answer:"Infrastructure as Code (IaC) is the management and provisioning of IT infrastructure (networks, virtual machines, load balancers) through machine-readable definition files (such as Terraform or CloudFormation) rather than physical hardware configuration or interactive configuration tools.",keywords:["iac","infrastructure as code","terraform","cloudformation","automation"],relatedIds:["cloud-1","cloud-3"]},{id:"cloud-7",domain:"cloud-computing",category:"Networking",question:"What is a Content Delivery Network (CDN)?",answer:"A Content Delivery Network (CDN) is a geographically distributed network of proxy servers and data centers. It caches static and dynamic web content (images, JavaScript, CSS, video) close to physical end users, dramatically minimizing latency and server load.",keywords:["cdn","content delivery network","cloudflare","caching","edge computing"],relatedIds:["cloud-1","web-7"]},{id:"cloud-8",domain:"cloud-computing",category:"Architecture",question:"What are microservices compared to monolithic architecture?",answer:"A monolithic architecture packages all business features and UI into a single codebase and deployment unit. A microservices architecture structures an application as a collection of small, loosely coupled, independently deployable services organized around specific business domains.",keywords:["microservices","monolith","architecture","distributed systems","scalability"],relatedIds:["cloud-3","cloud-4"]},{id:"cloud-9",domain:"cloud-computing",category:"High Availability",question:"What is load balancing in cloud systems?",answer:"Load balancing is the systematic distribution of incoming network traffic across multiple backend servers to ensure no single server bears too much demand, maximizing application throughput, availability, and fault tolerance.",keywords:["load balancer","high availability","traffic routing","scaling","fault tolerance"],relatedIds:["cloud-1","cloud-8"]},{id:"cloud-10",domain:"cloud-computing",category:"Security",question:"What is the Cloud Shared Responsibility Model?",answer:"The Shared Responsibility Model defines security obligations between the cloud provider and the customer: the cloud provider secures the underlying cloud infrastructure (physical hardware, virtualization, facilities), while the customer is responsible for security IN the cloud (customer data, IAM, OS updates, and firewall rules).",keywords:["shared responsibility","cloud security","iam","compliance","aws security"],relatedIds:["cloud-1","sec-1"]},{id:"sec-1",domain:"cybersecurity",category:"Threats",question:"What is phishing and how do you spot it?",answer:"Phishing is a social engineering cyberattack where attackers impersonate reputable institutions (banks, employers, cloud services) via deceptive emails, messages, or fake websites to trick individuals into disclosing passwords, credit card numbers, or sensitive credentials.",keywords:["phishing","social engineering","scam","email security","credentials"],relatedIds:["sec-2","sec-3"]},{id:"sec-2",domain:"cybersecurity",category:"Authentication",question:"What is Two-Factor Authentication (2FA) or MFA?",answer:"Two-Factor Authentication (2FA) is a security process where a user verifies their identity using two distinct authentication factors: something you know (password), something you have (smartphone authenticator app or hardware security key), or something you are (biometrics).",keywords:["2fa","mfa","multi factor authentication","security key","passwords","authenticator"],relatedIds:["sec-1","sec-4"]},{id:"sec-3",domain:"cybersecurity",category:"Threats",question:"What is ransomware and how does it spread?",answer:"Ransomware is a malicious software (malware) variant that encrypts victim files, storage disks, or operational databases, rendering them inaccessible until the victim pays a monetary ransom (frequently in cryptocurrency) in exchange for the decryption key.",keywords:["ransomware","malware","encryption","cyber attack","backup","ransom"],relatedIds:["sec-1","sec-6"]},{id:"sec-4",domain:"cybersecurity",category:"Cryptography",question:"What is the difference between symmetric and asymmetric encryption?",answer:"Symmetric encryption uses a single shared secret key to both encrypt and decrypt data (e.g. AES-256). Asymmetric encryption uses a mathematically linked public-private key pair where the public key encrypts data and only the matching private key can decrypt it (e.g. RSA, ECC).",keywords:["encryption","symmetric","asymmetric","public key","private key","aes","rsa"],relatedIds:["sec-5","tech-3"]},{id:"sec-5",domain:"cybersecurity",category:"Network Security",question:"What is a VPN and what does it protect?",answer:"A Virtual Private Network (VPN) creates an encrypted tunnel between your device and a secure remote server, masking your true IP address and encrypting all internet traffic against snooping on public Wi-Fi networks or local ISP tracking.",keywords:["vpn","virtual private network","privacy","encrypted tunnel","ip masking"],relatedIds:["sec-4","tech-3"]},{id:"sec-6",domain:"cybersecurity",category:"Architecture",question:"What is the Zero Trust security model?",answer:'Zero Trust is a cybersecurity framework built around the principle "never trust, always verify." It assumes that threats exist both outside and inside traditional network perimeters, requiring every user, device, and request to be strictly authenticated, authorized, and continuously validated before access is granted.',keywords:["zero trust","perimeter security","least privilege","iam","network defense"],relatedIds:["sec-2","sec-7"]},{id:"sec-7",domain:"cybersecurity",category:"Web Security",question:"What is SQL Injection (SQLi) and how is it prevented?",answer:"SQL Injection is a web vulnerability where malicious SQL commands are inserted into input entry fields (like login forms) to manipulate backend database queries. It is prevented by using parameterized queries (prepared statements), ORM tools, and input sanitization.",keywords:["sql injection","sqli","prepared statements","database attack","web security"],relatedIds:["web-3","sec-8"]},{id:"sec-8",domain:"cybersecurity",category:"Web Security",question:"What is Cross-Site Scripting (XSS)?",answer:"Cross-Site Scripting (XSS) is a security vulnerability where an attacker injects malicious client-side scripts into web pages viewed by other users. This allows attackers to steal session cookies, hijack accounts, or redirect users to malicious URLs.",keywords:["xss","cross site scripting","javascript injection","session hijack","sanitization"],relatedIds:["sec-7","web-8"]},{id:"sec-9",domain:"cybersecurity",category:"Network Attacks",question:"What is a DDoS attack?",answer:"A Distributed Denial of Service (DDoS) attack attempts to render an online service or website unavailable by overwhelming it with an immense deluge of fake internet traffic sourced from thousands of compromised computers (a botnet).",keywords:["ddos","denial of service","botnet","traffic flood","mitigation"],relatedIds:["cloud-7","sec-5"]},{id:"sec-10",domain:"cybersecurity",category:"Best Practices",question:"What is a password manager and why should you use one?",answer:"A password manager is a cryptographic application that generates, encrypts, and safely stores complex, unique passwords for all your online accounts in a master-encrypted vault, eliminating password reuse vulnerabilities.",keywords:["password manager","credential vault","passwords","encryption","master password"],relatedIds:["sec-1","sec-2"]},{id:"mob-1",domain:"mobile-dev",category:"Cross-Platform",question:"What is the difference between React Native and Flutter?",answer:"React Native (by Meta) uses JavaScript/TypeScript and renders to native platform UI widgets using bridge/JSI architecture. Flutter (by Google) uses the Dart language and renders its own UI pixels directly to a high-performance Skia/Impeller canvas, giving identical look-and-feel across Android and iOS.",keywords:["react native","flutter","dart","cross platform","mobile framework"],relatedIds:["mob-2","mob-3"]},{id:"mob-2",domain:"mobile-dev",category:"Native vs Hybrid",question:"What is native mobile development versus cross-platform?",answer:"Native mobile development utilizes platform-specific languages (Swift/SwiftUI for iOS, Kotlin/Jetpack Compose for Android) to achieve optimal performance and immediate access to hardware APIs. Cross-platform frameworks allow a single shared codebase to compile apps for both platforms.",keywords:["native app","swift","kotlin","cross platform","hybrid mobile"],relatedIds:["mob-1","mob-4"]},{id:"mob-3",domain:"mobile-dev",category:"iOS",question:"What is SwiftUI in iOS development?",answer:"SwiftUI is Apple's modern declarative framework for building user interfaces across all Apple platforms (iOS, iPadOS, macOS, watchOS). It replaces UIKit imperative view controllers with reactive, state-driven syntax.",keywords:["swiftui","ios","apple","swift","declarative ui","uikit"],relatedIds:["mob-2","web-2"]},{id:"mob-4",domain:"mobile-dev",category:"Android",question:"What is Jetpack Compose for Android?",answer:"Jetpack Compose is Google's modern declarative UI toolkit for native Android development. Similar to React and SwiftUI, it simplifies Android UI creation using Kotlin functions without cumbersome XML layout files.",keywords:["jetpack compose","android","kotlin","declarative ui","google mobile"],relatedIds:["mob-2","mob-3"]},{id:"mob-5",domain:"mobile-dev",category:"Architecture",question:"What is the mobile application lifecycle?",answer:"The mobile app lifecycle represents the states an app transitions through from launch to termination: Not Running, Inactive, Active (foreground), Background, and Suspended. Handling lifecycle events correctly ensures battery conservation and data persistence.",keywords:["app lifecycle","background state","active","suspended","mobile memory"],relatedIds:["mob-2","mob-6"]},{id:"mob-6",domain:"mobile-dev",category:"Web & Mobile",question:"What is a Progressive Web App (PWA)?",answer:"A Progressive Web App (PWA) is a website built with modern web technologies (Service Workers, Web App Manifest, Cache API) that behaves like a native mobile app, offering offline capabilities, home screen installation, and push notifications.",keywords:["pwa","progressive web app","service worker","manifest","offline web"],relatedIds:["web-1","mob-1"]},{id:"mob-7",domain:"mobile-dev",category:"Deployment",question:"What are the requirements for deploying an app to the Apple App Store?",answer:"Publishing to the Apple App Store requires an Apple Developer Program membership ($99/year), an app bundle signed with distribution certificates and provisioning profiles, app privacy details, high-resolution screenshots, and adherence to Apple's App Review Guidelines.",keywords:["app store","apple developer","deployment","app review","ios publishing"],relatedIds:["mob-8","mob-2"]},{id:"mob-8",domain:"mobile-dev",category:"Deployment",question:"What are the requirements for deploying an app to Google Play Store?",answer:"Publishing to Google Play requires a Google Play Console developer account (one-time $25 registration fee), an Android App Bundle (.aab) signed with an upload key, target API level compliance, privacy policy URL, and completion of content rating questionnaires.",keywords:["google play","play store","android bundle","aab","publishing"],relatedIds:["mob-7","mob-4"]},{id:"mob-9",domain:"mobile-dev",category:"Notifications",question:"How do push notifications work on mobile devices?",answer:"Mobile push notifications route through platform notification gateways: Apple Push Notification service (APNs) for iOS and Firebase Cloud Messaging (FCM) for Android. The server sends a payload to the gateway, which routes it directly to the target device token.",keywords:["push notifications","fcm","apns","firebase","device token"],relatedIds:["mob-5","cloud-1"]},{id:"mob-10",domain:"mobile-dev",category:"Testing",question:"What is the difference between an emulator and a physical test device?",answer:"An emulator or simulator mimics a device's software environment on your computer CPU for quick debugging, whereas physical test devices reflect real-world hardware conditions, battery constraints, camera behavior, sensors, and throttling.",keywords:["emulator","simulator","physical device","mobile testing","debugging"],relatedIds:["mob-2","mob-5"]},{id:"fin-1",domain:"finance",category:"Savings",question:"What is compound interest and how is it calculated?",answer:'Compound interest is the interest calculated on the initial principal and also on the accumulated interest from prior periods ("interest on interest"). The formula is A = P(1 + r/n)^(nt), where P is principal, r is annual interest rate, n is compounding frequency per year, and t is time in years.',keywords:["compound interest","interest formula","principal","savings","wealth building"],relatedIds:["fin-2","fin-3"]},{id:"fin-2",domain:"finance",category:"Credit",question:"What is a credit score and what factors affect it?",answer:"A credit score (typically FICO, ranging 300–850) is a statistical metric predicting your creditworthiness. Factors include Payment History (35%), Amounts Owed/Credit Utilization (30%), Length of Credit History (15%), New Credit Inquiries (10%), and Credit Mix (10%). Note: For personalized financial advice, consult a licensed financial advisor.",keywords:["credit score","fico","credit utilization","credit history","debt"],relatedIds:["fin-1","fin-4"]},{id:"fin-3",domain:"finance",category:"Investing",question:"What is an Index Fund and how does it compare to individual stocks?",answer:"An index fund is a type of mutual fund or ETF designed to passively track the performance of a financial market benchmark, such as the S&P 500. It offers broad diversification and low expense ratios compared to picking individual stocks. Note: Educational information only.",keywords:["index fund","etf","s&p 500","stocks","investing","diversification"],relatedIds:["fin-1","fin-5"]},{id:"fin-4",domain:"finance",category:"Banking",question:"What is the difference between a checking and a savings account?",answer:"A checking account is designed for everyday transactional liquidity (deposits, debit card purchases, bill payments, ATM withdrawals) with little to no interest. A savings account is designed for capital preservation and emergency funds, offering interest on balances with withdrawal limits.",keywords:["checking account","savings account","liquidity","debit card","banking"],relatedIds:["fin-1","fin-2"]},{id:"fin-5",domain:"finance",category:"Retirement",question:"What is the difference between a Traditional IRA and a Roth IRA?",answer:"A Traditional IRA allows tax-deductible contributions now, with investments growing tax-deferred until distributions are taxed as ordinary income in retirement. A Roth IRA uses post-tax dollars; investments grow tax-free and qualified withdrawals in retirement are completely tax-free.",keywords:["ira","roth ira","traditional ira","retirement","taxes","tax free"],relatedIds:["fin-1","fin-3"]},{id:"fin-6",domain:"finance",category:"Mortgage",question:"What is a fixed-rate mortgage versus an adjustable-rate mortgage (ARM)?",answer:"A fixed-rate mortgage maintains the exact same interest rate and monthly principal-and-interest payment for the entire loan life (e.g. 15 or 30 years). An ARM starts with a lower fixed rate for an initial introductory period, then periodically adjusts according to market indices.",keywords:["mortgage","fixed rate","arm","home loan","interest rate","real estate finance"],relatedIds:["fin-1","real-1"]},{id:"fin-7",domain:"finance",category:"Budgeting",question:"What is the 50/30/20 budgeting rule?",answer:"The 50/30/20 rule is an intuitive personal budgeting framework that allocates your after-tax income: 50% for Needs (housing, utilities, groceries, transportation), 30% for Wants (dining out, entertainment, hobbies), and 20% for Savings and debt repayment.",keywords:["50 30 20","budgeting","personal finance","savings","financial planning"],relatedIds:["fin-1","fin-4"]},{id:"fin-8",domain:"finance",category:"Banking",question:"What is FDIC insurance in banking?",answer:"FDIC (Federal Deposit Insurance Corporation) insurance protects depositor accounts at insured US financial institutions up to $250,000 per depositor, per insured bank, for each account ownership category in the event of a bank insolvency.",keywords:["fdic","deposit insurance","bank failure","safe money","banking regulations"],relatedIds:["fin-4","fin-1"]},{id:"fin-9",domain:"finance",category:"Investing",question:"What is dollar-cost averaging (DCA)?",answer:"Dollar-Cost Averaging is an investment strategy where an individual invests a fixed dollar amount into a given asset on a consistent schedule regardless of asset price, buying more shares when prices drop and fewer when prices rise.",keywords:["dollar cost averaging","dca","investing strategy","volatility","stocks"],relatedIds:["fin-3","fin-1"]},{id:"fin-10",domain:"finance",category:"Fintech",question:"What is a payment gateway and how does it process transactions?",answer:"A payment gateway (e.g. Stripe, PayPal) securely encrypts and captures customer payment data, routes it through card payment networks to the acquiring bank and issuing bank for authorization, and returns approval status back to the merchant within seconds.",keywords:["payment gateway","stripe","merchant","credit card processing","fintech"],relatedIds:["ecom-2","sec-4"]},{id:"health-1",domain:"healthcare",category:"Preventive Care",question:"What is preventive healthcare and why is it important?",answer:"Preventive healthcare involves routine measures such as health screenings, immunizations, annual check-ups, and lifestyle counseling taken to prevent diseases before they develop or catch them early when treatment is most effective. Disclaimer: Consult a medical doctor for medical guidance.",keywords:["preventive healthcare","checkup","wellness","screenings","doctor"],relatedIds:["health-2","health-3"]},{id:"health-2",domain:"healthcare",category:"Lifestyle",question:"How much water should an average adult drink daily?",answer:"The general recommendation from health authorities is approximately 2.5 to 3.7 liters (roughly 8–12 cups) of fluids per day for healthy adults, varying by physical activity levels, climate, diet, and health conditions.",keywords:["water intake","hydration","fluids","health habits","wellness"],relatedIds:["health-1","health-4"]},{id:"health-3",domain:"healthcare",category:"Sleep",question:"Why is 7 to 9 hours of sleep crucial for adults?",answer:"Adequate sleep enables critical physiological recovery: cellular repair, immune system strengthening, consolidation of cognitive memories, emotional regulation, and neurotoxic waste clearance from the brain via the glymphatic system.",keywords:["sleep","rest","sleep hygiene","mental health","recovery"],relatedIds:["health-1","health-4"]},{id:"health-4",domain:"healthcare",category:"Fitness",question:"What is the recommended weekly physical exercise for adults?",answer:"According to the World Health Organization (WHO), adults aged 18–64 should engage in at least 150–300 minutes of moderate-intensity aerobic physical activity or 75–150 minutes of vigorous aerobic activity weekly, paired with muscle-strengthening activities on 2 or more days.",keywords:["exercise","aerobic","physical activity","cardio","strength training","who"],relatedIds:["health-1","health-2"]},{id:"health-5",domain:"healthcare",category:"Insurance",question:"What is the difference between health insurance deductible, copay, and coinsurance?",answer:"A deductible is the amount you pay out-of-pocket for covered services before insurance begins paying. A copay is a fixed flat fee paid at each visit (e.g. $25 for a primary care doctor). Coinsurance is your percentage share of costs (e.g. 20%) after meeting your deductible.",keywords:["health insurance","deductible","copay","coinsurance","out of pocket"],relatedIds:["health-1","fin-8"]},{id:"health-6",domain:"healthcare",category:"Digital Health",question:"What is telemedicine and how does a virtual consultation work?",answer:"Telemedicine allows patients to consult healthcare providers remotely using video calling, secure messaging, or telephone for routine check-ups, medication reviews, and non-emergency medical inquiries from home.",keywords:["telemedicine","telehealth","virtual doctor","online consultation"],relatedIds:["health-1","tech-1"]},{id:"health-7",domain:"healthcare",category:"Mental Health",question:"What are effective techniques for managing daily acute stress?",answer:"Evidence-based stress management techniques include box breathing (inhale 4s, hold 4s, exhale 4s, hold 4s), progressive muscle relaxation, regular aerobic exercise, limiting excessive caffeine intake, and structured mindfulness meditation.",keywords:["stress management","breathing techniques","mindfulness","mental wellness"],relatedIds:["health-3","prod-3"]},{id:"health-8",domain:"healthcare",category:"Nutrition",question:"What is the Mediterranean Diet and why is it recommended?",answer:"The Mediterranean diet emphasizes whole plant foods (vegetables, fruits, legumes, whole grains, nuts, extra virgin olive oil), moderate fish and poultry intake, and minimal processed sugars and red meats. Clinical studies link it to reduced cardiovascular disease risk.",keywords:["mediterranean diet","nutrition","heart health","dietary habits","whole foods"],relatedIds:["health-1","food-1"]},{id:"health-9",domain:"healthcare",category:"Preventive Care",question:"What is BMI and what are its clinical limitations?",answer:"BMI (Body Mass Index) calculates weight in kilograms divided by height in meters squared. While useful for general population epidemiological surveys, it does not distinguish between muscle mass and adipose fat, nor does it account for fat distribution.",keywords:["bmi","body mass index","body composition","health metrics"],relatedIds:["health-1","health-4"]},{id:"health-10",domain:"healthcare",category:"First Aid",question:"What does the RICE method stand for in treating acute sprains?",answer:"RICE stands for Rest the injured area, Ice with cold packs for 15-20 minutes, Compress with an elastic bandage, and Elevate above heart level to reduce swelling and acute inflammation. Disclaimer: Seek professional medical attention for severe trauma.",keywords:["rice method","first aid","sprain","injury","swelling"],relatedIds:["health-1","health-4"]},{id:"edu-1",domain:"education",category:"Admissions",question:"How do university admissions committees evaluate applicants?",answer:"Colleges use holistic admissions reviews considering high school GPA, course rigor (AP/IB/Honors), standardized test scores (SAT/ACT), letters of recommendation, personal statements/essays, and extracurricular leadership achievements.",keywords:["admissions","college application","gpa","sat","act","university"],relatedIds:["edu-2","edu-3"]},{id:"edu-2",domain:"education",category:"Financial Aid",question:"What is FAFSA and how does financial aid work?",answer:"FAFSA (Free Application for Federal Student Aid) is the official federal form that determines eligibility for student financial assistance in the United States, including Pell Grants, federal student loans, and work-study opportunities.",keywords:["fafsa","financial aid","student loans","grants","tuition assistance"],relatedIds:["edu-1","fin-1"]},{id:"edu-3",domain:"education",category:"Study Skills",question:"What is Spaced Repetition and Active Recall in studying?",answer:"Active recall involves actively retrieving information from memory (e.g. flashcards or practice tests) rather than passively re-reading. Spaced repetition schedules reviews at increasing intervals (1 day, 3 days, 1 week) to cement memories against the forgetting curve.",keywords:["spaced repetition","active recall","studying","anki","memory retention","exams"],relatedIds:["edu-4","prod-1"]},{id:"edu-4",domain:"education",category:"Exams",question:"How can students effectively prepare for final exams?",answer:"Effective exam preparation strategies include creating an outline schedule 2–3 weeks in advance, taking timed practice tests under exam conditions, teaching concepts to peers (Feynman Technique), and ensuring adequate sleep prior to test day.",keywords:["exam prep","finals","test taking","feynman technique","study habits"],relatedIds:["edu-3","prod-4"]},{id:"edu-5",domain:"education",category:"Online Learning",question:"What are MOOCs and how do they work?",answer:"MOOCs (Massive Open Online Courses) are web-based distance learning courses provided by universities and institutions through platforms like Coursera and edX, offering accessible lectures, quizzes, and verifiable certificates.",keywords:["mooc","online courses","coursera","edx","distance education","e learning"],relatedIds:["edu-1","prog-8"]},{id:"edu-6",domain:"education",category:"Degrees",question:"What is the difference between a Bachelor of Arts (BA) and Bachelor of Science (BS)?",answer:"A Bachelor of Science (BS) typically focuses on technical depth, quantitative analysis, lab coursework, and specialized major requirements. A Bachelor of Arts (BA) focuses on broader liberal arts education, humanities, and elective flexibility.",keywords:["ba","bs","bachelor degree","major","college degree"],relatedIds:["edu-1","jobs-1"]},{id:"edu-7",domain:"education",category:"Scholarships",question:"Where can students find reputable college scholarships?",answer:"Students can search platforms like Fastweb, Scholarships.com, College Board Scholarship Search, their target university financial aid office, local civic organizations, and professional diversity associations.",keywords:["scholarships","grants","free money","college funding","financial aid"],relatedIds:["edu-2","edu-1"]},{id:"edu-8",domain:"education",category:"Academic Integrity",question:"What is plagiarism and how can it be avoided?",answer:"Plagiarism is presenting someone else's words, research, ideas, or artistic work as your own without proper credit. It is avoided by citing sources with academic citation styles (APA, MLA, IEEE) and using quotes appropriately.",keywords:["plagiarism","academic integrity","citation","apa","mla","research ethics"],relatedIds:["edu-1","legal-3"]},{id:"edu-9",domain:"education",category:"Grad School",question:"What is the difference between a Master's degree and a PhD?",answer:"A Master's degree typically takes 1–2 years focusing on advanced coursework and professional mastery. A PhD (Doctor of Philosophy) requires 4–6 years centered around original independent doctoral research and defending a dissertation.",keywords:["phd","masters degree","graduate school","dissertation","research"],relatedIds:["edu-6","jobs-1"]},{id:"edu-10",domain:"education",category:"Study Skills",question:"What is the Feynman Technique for learning complex concepts?",answer:"The Feynman Technique involves 4 steps: 1) Choose a concept, 2) Explain it in simple plain language as if teaching a 12-year-old, 3) Identify gaps where your explanation broke down, and 4) Review source material and simplify further.",keywords:["feynman technique","learning","richard feynman","study methods","simplification"],relatedIds:["edu-3","edu-4"]},{id:"jobs-1",domain:"jobs",category:"Resumes",question:"How do you format a modern technical resume for ATS?",answer:'To pass Applicant Tracking Systems (ATS), use a single-column layout, standard fonts, clear headings (Experience, Education, Skills), quantifiable metrics (e.g. "reduced latency by 35%"), and match relevant keywords from the job description in PDF format.',keywords:["ats","resume format","cv","job application","resume tips","keywords"],relatedIds:["jobs-2","jobs-3"]},{id:"jobs-2",domain:"jobs",category:"Interviews",question:"What is the STAR method for behavioral job interviews?",answer:"The STAR method structures answers to behavioral interview questions: Situation (set the context), Task (describe your responsibility), Action (explain the specific steps you took), and Result (share measurable positive outcomes achieved).",keywords:["star method","interviewing","behavioral questions","job interview","career tips"],relatedIds:["jobs-1","jobs-4"]},{id:"jobs-3",domain:"jobs",category:"Networking",question:"How do you effectively optimize your LinkedIn profile?",answer:"Optimize LinkedIn with a professional headshot, a headline stating your value proposition (not just job title), an informative About section with key skills, detailed project achievements, and engaging with industry posts.",keywords:["linkedin","networking","personal branding","job search","headhunter"],relatedIds:["jobs-1","jobs-5"]},{id:"jobs-4",domain:"jobs",category:"Negotiation",question:"How should you negotiate a job offer salary?",answer:"Research compensation benchmarks on Levels.fyi or Glassdoor. Express enthusiastic appreciation for the offer, state your researched market value and counteroffer calmly, highlight specific qualifications you bring, and consider total compensation including equity, bonuses, and remote flexibility.",keywords:["salary negotiation","counter offer","compensation","benefits","job offer"],relatedIds:["jobs-2","fin-1"]},{id:"jobs-5",domain:"jobs",category:"Career Transition",question:"How can someone pivot into a software engineering career from a non-technical background?",answer:"Focus on mastering fundamentals in one core stack (e.g. JavaScript/TypeScript or Python), build 3 polished real-world portfolio projects solving authentic problems, contribute to open-source, write technical blog posts, and network actively.",keywords:["career pivot","coding bootcamp","self taught engineer","portfolio projects"],relatedIds:["prog-1","jobs-1"]},{id:"jobs-6",domain:"jobs",category:"Interviews",question:"What questions should an applicant ask an interviewer at the end of an interview?",answer:'Ask high-signal questions: "What does success look like in this role during the first 90 days?", "How does engineering prioritize technical debt against new features?", or "What is the biggest challenge the team is currently working through?"',keywords:["interview questions","asking questions","interviewer","team culture"],relatedIds:["jobs-2","jobs-7"]},{id:"jobs-7",domain:"jobs",category:"Workplace",question:"What is workplace burnout and how can it be addressed?",answer:"Burnout is a state of chronic physical and emotional exhaustion caused by prolonged unmanaged workplace stress. It is addressed by setting strict boundary hours, taking accrued PTO, reprioritizing workloads with managers, and unplugging digitally.",keywords:["burnout","workplace wellness","exhaustion","boundaries","work life balance"],relatedIds:["prod-3","health-7"]},{id:"jobs-8",domain:"jobs",category:"Remote Work",question:"How do you thrive in a remote work environment?",answer:"Establish a designated ergonomic workspace, maintain routine start and end times, communicate proactively via asynchronous documentation, take scheduled breaks, and socialize intentionally with teammates.",keywords:["remote work","wfh","work from home","asynchronous","productivity"],relatedIds:["prod-1","jobs-7"]},{id:"jobs-9",domain:"jobs",category:"Internships",question:"How can college students secure summer tech internships?",answer:"Apply early (August–November for subsequent summer), practice LeetCode algorithmic problem solving, showcase relevant coursework and GitHub repositories, attend university career fairs, and request employee referrals on LinkedIn.",keywords:["internship","summer internship","leetcode","student careers","referrals"],relatedIds:["jobs-1","edu-1"]},{id:"jobs-10",domain:"jobs",category:"Professional Growth",question:"What is the difference between an Individual Contributor (IC) and an Engineering Manager (EM)?",answer:"An Individual Contributor advances their technical leadership, system architecture, and code execution without direct reports (e.g. Senior, Staff, Principal Engineer). An Engineering Manager focuses on people leadership, career growth, team hiring, and organizational execution.",keywords:["individual contributor","engineering manager","ic track","management track","career ladder"],relatedIds:["jobs-2","prog-10"]},{id:"ecom-1",domain:"ecommerce",category:"Shopping Cart",question:"What is shopping cart abandonment and how can retailers reduce it?",answer:"Shopping cart abandonment occurs when online shoppers place items in an online cart but exit before completing purchase. It is reduced by offering transparent shipping costs upfront, guest checkout options, streamlined one-click payments (Apple Pay), and automated email recovery sequences.",keywords:["cart abandonment","checkout conversion","ecommerce","checkout optimization"],relatedIds:["ecom-2","ecom-3"]},{id:"ecom-2",domain:"ecommerce",category:"Payments",question:"What are Buy Now, Pay Later (BNPL) services?",answer:"Buy Now, Pay Later (BNPL) services (like Klarna and Affirm) allow consumers to split retail purchase amounts into several interest-free installments over time while the merchant receives payment immediately minus a processing fee.",keywords:["bnpl","buy now pay later","klarna","installments","ecommerce payments"],relatedIds:["ecom-1","fin-10"]},{id:"ecom-3",domain:"ecommerce",category:"Dropshipping",question:"What is dropshipping and how does it work?",answer:"Dropshipping is a retail business model where an online store does not stock the physical products it sells. When a customer makes a purchase, the merchant purchases the item from a third-party supplier who ships it directly to the end customer.",keywords:["dropshipping","ecommerce model","supply chain","retail fulfillment"],relatedIds:["ecom-1","biz-1"]},{id:"ecom-4",domain:"ecommerce",category:"Logistics",question:"What is reverse logistics in e-commerce?",answer:"Reverse logistics manages the end-to-end flow of products returned by consumers from the customer back to the seller or manufacturer for refunds, exchange, restocking, repair, or recycling.",keywords:["reverse logistics","returns","refunds","restocking","supply chain"],relatedIds:["ecom-1","ecom-5"]},{id:"ecom-5",domain:"ecommerce",category:"Platforms",question:"What are the main differences between Shopify and WooCommerce?",answer:"Shopify is a fully hosted, managed SaaS platform providing turnkey e-commerce tools, hosting, and security for a monthly subscription. WooCommerce is an open-source WordPress plugin offering total customization and self-hosting control.",keywords:["shopify","woocommerce","ecommerce platforms","online store","hosting"],relatedIds:["saas-1","web-1"]},{id:"ecom-6",domain:"ecommerce",category:"SEO & Marketing",question:"What is Product Schema Markup for e-commerce websites?",answer:"Product Schema is structured JSON-LD data embedded in product web pages that signals price, availability, aggregate customer star ratings, and brand to search engines, generating rich snippets on Google Search results.",keywords:["product schema","rich snippets","json ld","ecommerce seo","google shopping"],relatedIds:["web-1","ecom-1"]},{id:"ecom-7",domain:"ecommerce",category:"Customer Loyalty",question:"What makes an e-commerce customer loyalty program effective?",answer:"Effective loyalty programs offer friction-free signups, clear tiered point earning (e.g. 1 point per $1 spent), exclusive experiential rewards, early access to new product releases, and seamless redemption directly inside the checkout cart.",keywords:["loyalty program","customer retention","reward points","customer lifetime value"],relatedIds:["ecom-1","biz-3"]},{id:"ecom-8",domain:"ecommerce",category:"Security",question:"What is PCI-DSS compliance in online stores?",answer:"PCI-DSS (Payment Card Industry Data Security Standard) is an information security standard mandated for any merchant handling branded credit cards from major schemes to protect cardholder data and prevent transaction fraud.",keywords:["pci dss","card security","payment compliance","fraud prevention"],relatedIds:["sec-4","fin-10"]},{id:"ecom-9",domain:"ecommerce",category:"Metrics",question:"What is Customer Lifetime Value (CLV or LTV)?",answer:"Customer Lifetime Value (LTV) represents the total net revenue a business reasonably expects to generate from a single customer relationship over the entire lifespan of their engagement with the company.",keywords:["ltv","customer lifetime value","ecommerce metrics","cac","retention"],relatedIds:["ecom-7","biz-4"]},{id:"ecom-10",domain:"ecommerce",category:"Inventory",question:"What is SKUs and how are they used in product management?",answer:"A SKU (Stock Keeping Unit) is a unique alphanumeric scannable code assigned to each distinct product variation (such as style, color, size) to accurately track inventory levels and stock across warehouses.",keywords:["sku","stock keeping unit","inventory tracking","warehouse","catalog"],relatedIds:["ecom-4","ecom-1"]},{id:"travel-1",domain:"travel",category:"Planning",question:"How can I plan a comprehensive travel itinerary?",answer:"Start by setting travel dates and budget, research peak vs shoulder seasons, book flights and accommodations with free cancellation, map core attractions geographically to group nearby visits, and allocate downtime for spontaneous exploration.",keywords:["travel itinerary","trip planning","vacation","flight booking","travel guide"],relatedIds:["travel-2","travel-3"]},{id:"travel-2",domain:"travel",category:"Flights",question:"How do airlines handle flight cancellations and passenger compensation?",answer:"If an airline cancels your flight, you are entitled to a full cash refund or rebooking on the next available flight. In regions like the European Union (under regulation EU 261), passengers may also be entitled to cash compensation for delays caused by airline operations.",keywords:["flight cancellation","airline compensation","eu 261","refund","delay"],relatedIds:["travel-1","travel-4"]},{id:"travel-3",domain:"travel",category:"Luggage",question:"What are the standard TSA carry-on liquid restrictions (3-1-1 rule)?",answer:"The TSA 3-1-1 rule requires that all liquids, gels, and aerosols in carry-on luggage must be in containers of 3.4 ounces (100ml) or less, placed within 1 clear quart-sized resealable bag per passenger.",keywords:["tsa","carry on liquids","3-1-1 rule","airport security","luggage rules"],relatedIds:["travel-1","travel-2"]},{id:"travel-4",domain:"travel",category:"Insurance",question:"What does comprehensive travel insurance cover?",answer:"Travel insurance typically covers trip cancellation/interruption due to unforeseen medical emergencies, lost or delayed baggage, emergency medical evacuations, and travel accidents during your trip.",keywords:["travel insurance","trip protection","medical evacuation","lost luggage"],relatedIds:["travel-1","travel-2"]},{id:"travel-5",domain:"travel",category:"Documentation",question:"What is the difference between a passport and a visa?",answer:"A passport is an official government-issued identification certifying your citizenship and identity for international travel. A visa is a specific entry permit issued by the destination country's government granting permission to enter, stay, or work for a designated duration.",keywords:["passport","visa","international travel","consulate","border control"],relatedIds:["travel-1","gov-1"]},{id:"travel-6",domain:"travel",category:"Hotels",question:"How can you cancel or modify a hotel booking?",answer:"Review the cancellation policy on your confirmation receipt. If booked with free cancellation (typically up to 24–48 hours before check-in), you can cancel through the booking portal (or app) for an immediate refund. Non-refundable rates usually require contacting hotel management directly.",keywords:["cancel hotel","hotel booking","cancellation policy","refund","hospitality"],relatedIds:["travel-1","travel-4"]},{id:"travel-7",domain:"travel",category:"Currency",question:"What is the best way to handle money and foreign exchange while traveling abroad?",answer:"Use a debit or credit card with zero foreign transaction fees, withdraw local currency from official bank ATMs rather than airport kiosks, and always choose to be billed in the local currency (decline dynamic currency conversion at card terminals).",keywords:["foreign exchange","travel money","no foreign transaction fee","atm abroad","currency"],relatedIds:["travel-1","fin-4"]},{id:"travel-8",domain:"travel",category:"Jet Lag",question:"How can travelers minimize jet lag across multiple time zones?",answer:"Gradually adjust sleep schedules 2–3 days prior to departure, stay hydrated, avoid alcohol and caffeine on long-haul flights, and immediately expose yourself to natural morning sunlight upon arrival in the new time zone.",keywords:["jet lag","time zone","sleep travel","sunlight exposure","circadian rhythm"],relatedIds:["travel-1","health-3"]},{id:"travel-9",domain:"travel",category:"Packing",question:"What are essential packing strategies for international travel?",answer:"Roll clothes or use compression packing cubes, pack essentials and medications in your carry-on bag, carry universal power adapters, make offline digital copies of travel documents, and pack versatile clothing layers.",keywords:["packing tips","packing cubes","carry on","travel essentials","universal adapter"],relatedIds:["travel-3","travel-1"]},{id:"travel-10",domain:"travel",category:"Lodging",question:"What is the difference between a boutique hotel and a resort?",answer:"A boutique hotel is a smaller, design-driven, intimate property (often 10–100 rooms) located within urban cultural neighborhoods. A resort is a large destination property offering self-contained amenities (pools, spas, dining, recreation) on site.",keywords:["boutique hotel","resort","hospitality","accommodations","lodging"],relatedIds:["travel-6","travel-1"]},{id:"biz-1",domain:"business",category:"Foundations",question:"What is a Minimum Viable Product (MVP)?",answer:"A Minimum Viable Product (MVP) is the most basic functional version of a product that allows a startup team to collect the maximum amount of validated learning about customers with the least effort and development cost.",keywords:["mvp","minimum viable product","lean startup","product launch","validation"],relatedIds:["biz-2","biz-3"]},{id:"biz-2",domain:"business",category:"Funding",question:"What are the main stages of startup funding?",answer:"Startup funding progression typically involves: Pre-Seed (founders/friends), Seed Stage (angel investors), Series A (demonstrating product-market fit), Series B (scaling customer acquisition), Series C+ (market dominance and expansion), leading to an IPO or acquisition.",keywords:["venture capital","seed round","series a","angel investors","startup funding"],relatedIds:["biz-1","biz-4"]},{id:"biz-3",domain:"business",category:"Product-Market Fit",question:"What is Product-Market Fit (PMF) and how do you recognize it?",answer:"Product-Market Fit occurs when a company successfully validates that a substantial market exists and its product satisfies that market demand. Hallmarks include organic word-of-mouth referral growth, declining customer acquisition costs, and high retention.",keywords:["product market fit","pmf","retention","market demand","growth"],relatedIds:["biz-1","biz-5"]},{id:"biz-4",domain:"business",category:"Unit Economics",question:"What is the CAC to LTV ratio in business?",answer:"The ratio compares Customer Acquisition Cost (CAC) to Customer Lifetime Value (LTV). A healthy sustainable SaaS startup target is generally an LTV:CAC ratio of 3:1 or higher, meaning a customer yields three times what it costs to acquire them.",keywords:["cac","ltv","customer acquisition cost","unit economics","saas metrics"],relatedIds:["biz-2","saas-2"]},{id:"biz-5",domain:"business",category:"Strategy",question:"What is a SWOT analysis and how is it used?",answer:"A SWOT analysis is a strategic planning tool used to evaluate the internal Strengths and Weaknesses of an organization alongside external Opportunities and Threats in the marketplace.",keywords:["swot analysis","strengths weaknesses","business strategy","competitive analysis"],relatedIds:["biz-3","biz-6"]},{id:"biz-6",domain:"business",category:"Pitch Decks",question:"What are the essential slides in an investor pitch deck?",answer:"A standard investor pitch deck contains 10–12 slides: 1) Problem, 2) Solution, 3) Product Demo, 4) Market Size (TAM/SAM/SOM), 5) Business Model, 6) Go-to-Market Strategy, 7) Competitive Advantage, 8) Traction/Metrics, 9) Team, and 10) The Ask (funding amount).",keywords:["pitch deck","investor presentation","fundraising","tam","venture capital"],relatedIds:["biz-2","biz-1"]},{id:"biz-7",domain:"business",category:"Economics",question:"What is a runway and burn rate for a startup?",answer:"Burn rate is the net amount of cash a startup spends per month to keep operations running. Runway is the number of months the company can survive before running out of capital (calculated as Cash Balance divided by Monthly Burn Rate).",keywords:["burn rate","runway","cash flow","startup finances","runway calculation"],relatedIds:["biz-2","biz-4"]},{id:"biz-8",domain:"business",category:"Moats",question:"What is a business economic moat and what are common examples?",answer:"An economic moat is a structural competitive advantage that protects a company's market share and profit margins from competitors. Common moats include network effects, high switching costs, brand reputation, patents, and cost advantages.",keywords:["economic moat","competitive advantage","network effects","switching costs","warren buffett"],relatedIds:["biz-3","biz-5"]},{id:"biz-9",domain:"business",category:"Pricing",question:"What is value-based pricing versus cost-plus pricing?",answer:"Cost-plus pricing calculates the manufacturing/operating cost of a product and adds a fixed percentage markup. Value-based pricing sets prices based on the perceived monetary value, efficiency gains, or return on investment the customer derives from the solution.",keywords:["value based pricing","cost plus","pricing strategy","roi","margins"],relatedIds:["biz-1","saas-3"]},{id:"biz-10",domain:"business",category:"Legal Structure",question:"What is the difference between an LLC and a C-Corporation?",answer:"An LLC provides pass-through taxation and liability protection, suitable for small businesses. A Delaware C-Corporation has a separate corporate tax identity and is the required standard structure for venture capital investment and issuing employee stock option pools.",keywords:["llc","c corp","delaware corp","equity","incorporation"],relatedIds:["biz-2","legal-1"]},{id:"saas-1",domain:"saas",category:"Business Models",question:"What is Software as a Service (SaaS)?",answer:"SaaS is a software licensing and delivery model in which applications are centrally hosted on cloud infrastructure and accessed by subscribers over web browsers or mobile apps on a recurring monthly or annual subscription basis.",keywords:["saas","software as a service","subscription","cloud software","multi tenant"],relatedIds:["saas-2","cloud-2"]},{id:"saas-2",domain:"saas",category:"Metrics",question:"What is Monthly Recurring Revenue (MRR) and Annual Recurring Revenue (ARR)?",answer:"MRR is the predictable normalized revenue a subscription SaaS business anticipates earning each calendar month. ARR is the annualized value of all recurring subscription contracts (MRR multiplied by 12).",keywords:["mrr","arr","recurring revenue","saas metrics","subscription finances"],relatedIds:["saas-1","saas-3"]},{id:"saas-3",domain:"saas",category:"Metrics",question:"What is Churn Rate and how does it impact SaaS growth?",answer:"Churn rate is the percentage of customers (customer churn) or recurring revenue (revenue churn) that cancels their subscription within a given time period. High churn counteracts customer acquisition, capping long-term growth.",keywords:["churn rate","retention","revenue churn","customer cancellation","saas health"],relatedIds:["saas-2","biz-4"]},{id:"saas-4",domain:"saas",category:"Architecture",question:"What is multi-tenancy in cloud software architecture?",answer:"Multi-tenancy is an architectural pattern where a single shared instance of software and infrastructure serves multiple distinct customer organizations (tenants), with strict logical data isolation separating each tenant's data.",keywords:["multi tenancy","tenant isolati
